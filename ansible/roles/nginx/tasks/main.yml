---
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Web root
  ansible.builtin.file:
    path: "{{ app_web_root }}"
    state: directory
    owner: root
    group: www-data
    mode: "0755"

- name: Hide nginx version
  ansible.builtin.lineinfile:
    path: /etc/nginx/nginx.conf
    regexp: '^\s*#?\s*server_tokens'
    line: "\tserver_tokens off;"
    insertafter: 'http \{'
  notify: Reload nginx

- name: TravelMemory site (React static files + /api reverse proxy)
  ansible.builtin.template:
    src: travelmemory.conf.j2
    dest: /etc/nginx/sites-available/travelmemory
    mode: "0644"
  notify: Reload nginx

- name: Enable site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/travelmemory
    dest: /etc/nginx/sites-enabled/travelmemory
    state: link
  notify: Reload nginx

- name: Remove default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Validate nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Start and enable nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

---
mongodb_version: "7.0"
mongodb_port: 27017
mongodb_apt_key_url: "https://pgp.mongodb.com/server-{{ mongodb_version }}.asc"
mongodb_repo_uri: https://repo.mongodb.org/apt/ubuntu
mongodb_repo_suite: "{{ ansible_facts['distribution_release'] }}/mongodb-org/{{ mongodb_version }}"
mongodb_repo_components: multiverse
mongodb_packages:
  - mongodb-org
mongodb_bind_ips: "127.0.0.1,{{ private_ip }}"
mongodb_users_marker: /root/.mongodb_admin_created

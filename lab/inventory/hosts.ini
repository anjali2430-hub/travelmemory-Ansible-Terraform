# Lab inventory: same shape as the one Terraform writes, pointing at the Docker "EC2" containers.
[webservers]
web ansible_host=10.0.1.10 private_ip=10.0.1.10

[dbservers]
db ansible_host=10.0.2.10 private_ip=10.0.2.10

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=/srv/lab/lab-key
public_host=10.0.1.10
admin_cidr=10.0.0.1/32
vpc_cidr=10.0.0.0/16

[dbservers:vars]
ansible_ssh_common_args='-o ProxyCommand="ssh -W %h:%p -q -i /srv/lab/lab-key -o StrictHostKeyChecking=accept-new ubuntu@10.0.1.10"'
